version: 2
updates:
  # npm dev dependencies (build/lint/test tooling — the repo has no runtime deps yet).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript is pinned <6.1.0 by the typescript-eslint 8.x peer range
      # (see docs/runbook.md). Both minor (6.1+) and major (7.x) bumps break
      # `npm run lint`; allow only 6.0.x patches until that peer widens.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      # Collapse every dependency bump, major included, into one PR per
      # ecosystem to keep review noise low.
      dev-dependencies:
        patterns:
          - '*'
    commit-message:
      prefix: '[HARNESS]'

  # Keep the CI workflow's actions (checkout, setup-node) current & patched.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: '[HARNESS]'
