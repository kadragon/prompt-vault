name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches docs/runbook.md support floor (>=24); developed on Node 26.
          node-version: '24'
          cache: npm
      - run: npm ci
      # Same check the tracked pre-commit hook runs; repeated here because a clone that
      # never ran `npm run hooks:install` has no hook, and `--no-verify` bypasses one that does.
      - run: npm run check:versions
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
