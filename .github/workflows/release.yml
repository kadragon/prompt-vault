name: Release

# Packages the extension and publishes it as a GitHub Release when a push to main
# carries a new package.json version. Ordinary merges (docs, refactors) leave the
# version untouched and this workflow exits without building.

on:
  push:
    branches: [main]
  # Escape hatch: the push gate skips a version whose tag already exists, and a
  # hand-cut tag therefore suppresses that version's release for good — the next
  # merge compares against an already-bumped tip and skips too, with a green job as
  # the only signal. A dispatch republishes that version without a fake bump.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish — must equal package.json at the selected ref (e.g. 1.12.1)'
        required: true

# Never cancel a release mid-publish; queue instead.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # create the tag + release and upload the zip asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^ is the fallback comparison point when the pre-push tip is unreachable.
          fetch-depth: 2

      - id: gate
        name: Decide whether this merge publishes a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # `gh release view` exits 1 for a missing release *and* for auth, rate-limit and
          # transport failures. Treating every non-zero exit as "no release exists" turns a
          # flaky API call into a publish attempt over a release that is already public, so
          # the 404 (gh prints `release not found`) is the only failure allowed to answer no.
          release_exists() {
            local out rc=0
            out=$(gh release view "$1" 2>&1 >/dev/null) || rc=$?
            if [ "$rc" -eq 0 ]; then
              return 0
            fi
            if printf '%s\n' "$out" | grep -qi 'release not found'; then
              return 1
            fi
            echo "::error::could not determine whether release $1 exists — gh release view exited $rc: $out"
            exit 1
          }

          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # The version and tag guards below pin the version string and the tag commit, not the
            # branch, so without this any ref carrying a bumped package.json could publish a
            # release. Refused here rather than in the job `if:` so the run is red, not a green
            # skip — the silent skip is the failure mode this hatch exists to escape.
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::dispatched from $GITHUB_REF; releases publish from main only — re-run this workflow with main selected."
              exit 1
            fi
            # A dispatch is an explicit request, so every refusal below fails the job instead
            # of exiting green: the silent skip is the failure mode this hatch exists to escape.
            # The operator names the version because packaging derives the zip name from
            # package.json — a mismatch would upload an asset that was never built — and naming
            # it catches a dispatch from the wrong ref before anything is published.
            if [ "$REQUESTED" != "$version" ]; then
              echo "::error::requested v$REQUESTED but package.json at this ref is $version; dispatch from main once it carries that version."
              exit 1
            fi
            # An existing tag is exactly the state this hatch unblocks: gh release create reuses
            # the tag and ignores --target ("Unused if the Git tag already exists"). That makes a
            # tag pointing elsewhere dangerous rather than harmless — the release would be cut
            # from the tagged commit while the zip is built from this ref. Refuse instead.
            # Both refs are queried so an annotated tag matches on its peeled commit.
            # Fail closed: an ls-remote that cannot reach origin leaves the divergence unverified,
            # and an empty fallback would skip the guard and republish from the wrong commit.
            if ! tag_shas=$(git ls-remote --tags origin "refs/tags/v$version" "refs/tags/v$version^{}" | cut -f1); then
              echo "::error::could not read tag v$version from origin — refusing to publish with the tag-divergence guard unverified."
              exit 1
            fi
            if [ -n "$tag_shas" ] && ! printf '%s\n' "$tag_shas" | grep -qx "$GITHUB_SHA"; then
              echo "::error::tag v$version exists but does not point at this commit ($GITHUB_SHA); the release would be cut from the tagged commit — repoint or delete the tag before dispatching."
              exit 1
            fi
            # An existing *release* is public and is never replaced.
            if release_exists "v$version"; then
              echo "::error::release v$version already exists — refusing to replace a published release."
              exit 1
            fi
            echo "manual dispatch — will publish v$version."
          else
            # Compare against the pre-push tip, not HEAD^: a push can land several commits
            # (rebase merge, direct multi-commit push), and HEAD^ would then be a sibling of
            # the same series — a bump in an earlier commit would compare equal and the
            # release would be skipped with a green, silent run.
            base=''
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git fetch --depth=1 origin "$BEFORE" >/dev/null 2>&1; then
              base="$BEFORE"
            else
              # Unreachable pre-push tip (force-push, expired object, branch recreate): fall back to
              # HEAD^, which is the previous main tip for the merge and squash shapes this repo uses.
              base=$(git rev-parse -q --verify 'HEAD^' || true)
              [ -n "$base" ] && echo "warning: pre-push tip unavailable — comparing against HEAD^."
            fi

            # A parent without package.json, or with an unparseable one, leaves prev empty and the
            # version reads as changed; the tag/release guards below still prevent a double publish.
            prev=''
            if [ -n "$base" ]; then
              prev=$(git show "$base:package.json" 2>/dev/null \
                | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null) || prev=''
            fi

            if [ "$version" = "$prev" ]; then
              echo "package.json version unchanged ($version) — nothing to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Re-runs and hand-cut tags must not fail the job or clobber a published release.
            # A tag that suppresses the release permanently is recoverable via workflow_dispatch.
            if release_exists "v$version"; then
              echo "release v$version already exists — skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
              echo "tag v$version already exists on origin — skipping; re-run this workflow manually with version=$version to publish it."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "version ${prev:-<none>} -> $version — will publish."
          fi

          # The gate fires on inequality, so a revert that restores an older version still
          # publishes — correct, but it must not displace the newer release as "Latest".
          # A non-numeric tag (v-next, vBeta) would sort above every number under `sort -V` and
          # steal the marker, so only plain version tags are considered. An ls-remote hiccup
          # leaves `highest` empty, which errs toward marking this release Latest rather than
          # failing the job one step before packaging.
          highest=$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##; s/\^{}$//; s/^v//' \
            | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1) || highest=''
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -1)" = "$version" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is older than v$highest — publishing without the Latest marker."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          # Matches the CI workflow and the docs/runbook.md support floor (>=24).
          node-version: '24'
          cache: npm

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci

      # ci.yml runs on this same push but as an independent workflow, so nothing stops a
      # red commit from being packaged. Re-run its gates here: a published release is
      # public and cannot be quietly withdrawn.
      - if: steps.gate.outputs.publish == 'true'
        run: npm run check:versions
      - if: steps.gate.outputs.publish == 'true'
        run: npm run lint
      - if: steps.gate.outputs.publish == 'true'
        run: npm run typecheck
      - if: steps.gate.outputs.publish == 'true'
        run: npm test

      # Builds from source and zips dist/ -> prompt-vault-v<version>.zip at the repo root.
      # The script itself fails loud if dist/manifest.json disagrees with package.json.
      - if: steps.gate.outputs.publish == 'true'
        run: npm run package

      - if: steps.gate.outputs.publish == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
          LATEST: ${{ steps.gate.outputs.latest }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "prompt-vault-v$VERSION.zip" \
            --title "v$VERSION" \
            --generate-notes \
            --latest="$LATEST" \
            --target "$GITHUB_SHA"
