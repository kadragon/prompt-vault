name: Release

# Packages the extension and publishes it as a GitHub Release when a merge to main
# carries a new package.json version. Ordinary merges (docs, refactors) leave the
# version untouched and this workflow exits without building.

on:
  push:
    branches: [main]

# Never cancel a release mid-publish; queue instead.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # create the tag + release and upload the zip asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^ is the previous main tip (first parent of the merge commit); needed
          # to tell a version bump from any other merge.
          fetch-depth: 2

      - id: gate
        name: Decide whether this merge publishes a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # No parent (first commit) counts as a change.
          if prev_pkg=$(git show HEAD^:package.json 2>/dev/null); then
            prev=$(printf '%s' "$prev_pkg" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          else
            prev=''
          fi

          if [ "$version" = "$prev" ]; then
            echo "package.json version unchanged ($version) — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Re-runs and hand-cut tags must not fail the job or clobber a published release.
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "release v$version already exists — skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists on origin — skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version ${prev:-<none>} -> $version — will publish."
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          # Matches the CI workflow and the docs/runbook.md support floor (>=24).
          node-version: '24'
          cache: npm

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci

      # Builds from source and zips dist/ -> prompt-vault-v<version>.zip at the repo root.
      # The script itself fails loud if dist/manifest.json disagrees with package.json.
      - if: steps.gate.outputs.publish == 'true'
        run: npm run package

      - if: steps.gate.outputs.publish == 'true'
        name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" "prompt-vault-v$VERSION.zip" \
            --title "v$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA"
